name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check wormclicker tests
      - name: Tests (incl. Windows API, Tk UI smoke test)
        run: |
          python -m pytest -v -rs 2>&1 | Tee-Object -FilePath pytest.txt
          $code = $LASTEXITCODE
          $lines = Get-Content pytest.txt | Where-Object { $_ -match 'FAILED|ERROR|SKIPPED|passed|failed|Error' }
          $msg = ($lines | Select-Object -Last 40) -join '%0A'
          Write-Output "::notice title=pytest (Python ${{ matrix.python }})::$msg"
          exit $code
      - name: Benchmark (no real clicks)
        run: |
          python run_wormclicker.py --benchmark 2>&1 | Tee-Object -FilePath bench.txt
          $code = $LASTEXITCODE
          $msg = (Get-Content bench.txt | Select-Object -Last 25) -join '%0A'
          Write-Output "::notice title=benchmark (Python ${{ matrix.python }})::$msg"
          exit $code
      - name: Build exe
        if: matrix.python == '3.12'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WormClicker --collect-submodules dxcam run_wormclicker.py
          Copy-Item config.default.json dist/
          Copy-Item -Recurse practice dist/practice
      - name: Smoke-test exe starts
        if: matrix.python == '3.12'
        run: |
          $p = Start-Process -FilePath dist\WormClicker.exe -ArgumentList "--dry-run" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Output "::error::WormClicker.exe exited early, code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          $size = [math]::Round((Get-Item dist\WormClicker.exe).Length / 1MB, 1)
          Write-Output "::notice title=exe::WormClicker.exe started and kept running for 10 s (size $size MB)"
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: WormClicker-windows
          path: dist/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check wormclicker tests
      - run: python -m pytest -q
